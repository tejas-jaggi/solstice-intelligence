name: CI

# Runs on every push and pull request. No secrets are used and no OpenAI credit
# is spent: the entire test suite is deterministic (FakeLLMClient + mocks), and
# the image build/scan make no model call.
#
# Gate policy (ADR-011, extended to the container layer in ADR-012):
#   BLOCKING      — ruff (lint + format), pytest, mypy, docker build
#   INFORMATIONAL — coverage, pip-audit, container image vulnerability scan
#                   (never gate; a changing CVE database would make builds
#                   non-deterministic)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ---- BLOCKING GATES (deterministic, actionable) --------------------
      - name: Ruff lint (blocking)
        run: ruff check .

      - name: Ruff format check (blocking)
        run: ruff format --check .

      - name: Tests with coverage (blocking)
        run: pytest --cov --cov-report=term-missing

      - name: mypy (blocking)
        run: mypy app frontend

      # ---- INFORMATIONAL -------------------------------------------------
      - name: pip-audit dependency scan (advisory)
        continue-on-error: true
        run: pip-audit --requirement requirements.txt

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- BLOCKING: the image must build (no secret, no model call) -----
      - name: Build image (blocking)
        run: docker build -t solstice-intelligence:ci .

      # ---- INFORMATIONAL: CVE database changes over time -> never gate ---
      - name: Container image scan (advisory)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: solstice-intelligence:ci
          format: table
          exit-code: "0"
